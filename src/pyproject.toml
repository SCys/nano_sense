[project]
name = "ai-services"
version = "0.1.0"
description = "FastAPI-based AI services: ASR, TTS, embeddings, object detection"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.135.3",
    "funasr>=1.3.1",
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "numpy>=2.4.4",
    "openai>=2.30.0",
    "pillow>=12.2.0",
    "python-multipart>=0.0.22",
    "setuptools>=81.0.0",
    "ultralytics>=8.4.33",
    "uvicorn>=0.43.0",
    # TTS dependencies (VoxCPM2)
    "soundfile>=0.12.0",
    "tokenizers>=0.15",
    "voxcpm>=2.0.3",
]

[project.optional-dependencies]
torch = [
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
