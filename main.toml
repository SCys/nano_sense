[general]
log_level = "INFO"

[asr]
timeout_seconds = 1800
model_path = "./data/iic/speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch/"
# 长音频切分与标点恢复；置空可关闭
vad_model = "fsmn-vad"
punc_model = "ct-punc"
# ASR 推理设备：cuda:1 = GTX 1050 Ti（4GB，实测 RTF 与 T10 基本持平），cuda:0 = Tesla T10
device = "cuda:1"

[ultralytics]
model_path = "./data/yolo11s.pt"
timeout_seconds = 1800

[openai]
# api_key 请通过环境变量 OPENAI_API_KEY 提供，不要写入本文件
base_url = "http://10.1.3.26:8888/v1/openai"
timeout_seconds = 1800

[tts]
timeout_seconds = 1800
model_path = "./data/openbmb/VoxCPM2"
device = "cuda:0"

[rerank]
timeout_seconds = 1800
model_path = "./data/BAAI/bge-reranker-v2-m3"
device = "cuda:1"
